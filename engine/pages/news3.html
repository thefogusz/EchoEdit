<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#214AFF}
  #mascot,#fx{position:absolute;left:0;top:0} #mascot{z-index:40} #fx{z-index:90}
  #grain{position:absolute;inset:0;z-index:30;pointer-events:none;background-size:540px 960px;mix-blend-mode:multiply;opacity:.9}
  #desk{position:absolute;inset:0;overflow:hidden;z-index:0}
  #stage{position:absolute;inset:0;z-index:2}
  #desk img{position:absolute;left:0;top:0;transform-origin:0 0}
  .shot{position:absolute;inset:0;display:none;overflow:hidden}
  .sheet{position:absolute;box-shadow:0 22px 40px rgba(0,0,0,.28)}
  .cam{position:absolute;inset:0;transform-origin:540px 760px}
  .pc{position:absolute;transform-origin:50% 50%;will-change:transform}
  .kl{background:#FFF8EC;padding:12px;box-shadow:0 18px 30px rgba(0,0,0,.28),0 2px 0 rgba(0,0,0,.08)}
  .kl img,.kl video,.kl canvas{display:block;width:100%}
  .card{font-family:DEHead;padding:22px 34px 28px;box-shadow:0 14px 24px rgba(0,0,0,.25);line-height:1.12}
  .num{font:900 210px/1 DELatin,DEHead;letter-spacing:-6px;padding:18px 40px 26px;box-shadow:0 16px 28px rgba(0,0,0,.28)}
  .tape{position:absolute;height:54px;background:rgba(255,248,236,.78);box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .hl{position:absolute;background:#FFE14D;mix-blend-mode:multiply;transform-origin:0 50%}
  .src{position:absolute;left:60px;top:250px;font:700 28px DEBody;color:#111;background:#FFF8EC;padding:6px 18px;z-index:35;box-shadow:0 4px 10px rgba(0,0,0,.18)}
  .sect{position:absolute;right:60px;top:250px;font:800 32px DEHead;color:#FFF8EC;background:#111;padding:6px 20px 9px;z-index:35}
</style></head>
<body>
<canvas id="grid" width="1080" height="1920" style="position:absolute;left:0;top:0;z-index:1;pointer-events:none"></canvas>
<div id="desk"><img></div>
<div id="stage"></div>
<div id="grain"></div>
<canvas id="mascot" width="1080" height="1920"></canvas>
<canvas id="fx" width="1080" height="1920"></canvas>
<script src="../web/de.js"></script>
<script src="../web/collage.js"></script>
<script>
let D, cap, mascot, shots = [], fxG, docs, seed = 11;
const J = (p) => D.jobBase + '/' + p;
const ht = {};  // halftone cache by src

async function piece(p) {
  const el = document.createElement('div'); el.className = 'pc'; el.dataset.at = p.at ?? 0;
  el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; if (p.w) el.style.width = p.w + 'px';
  el._p = p; const torn = p.torn !== false ? CL.torn(seed++, 1.4) : 'none';
  if (p.k === 'photo') {
    let src = p.img.startsWith('brand:') ? D.brandBase + '/' + p.img.slice(6) : J(p.img);
    if (p.halftone) { if (!ht[src]) { const im = await DE.loadImage(src); ht[src] = CL.halftone(im, { w: Math.round(p.w * 1.2), cell: p.cell || 8 }); } src = ht[src]; }
    el.innerHTML = `<div class="kl" style="clip-path:${torn}"><img src="${src}"></div>`;
  } else if (p.k === 'video') {
    el.innerHTML = `<div class="kl" style="clip-path:${torn}"><video muted preload="auto" src="${J('assets/media/v' + p.n + '.webm')}"></video></div>`;
  } else if (p.k === 'doc') {
    const m = docs[p.doc], k = (p.w - 24) / m.w;
    el.innerHTML = `<div class="kl" style="clip-path:${torn};position:relative">${(p.highlights || []).map((hl) => (m.phrases[hl.phrase] || []).map((q) =>
      `<div class="hl" data-hl="${hl.at}" style="left:${12 + q[0] * k - 3}px;top:${12 + q[1] * k}px;width:${q[2] * k + 6}px;height:${q[3] * k}px"></div>`).join('')).join('')}
      <img src="${J('assets/docs/' + p.doc + '.png')}"></div>`;
  } else if (p.k === 'card') {
    el.innerHTML = `<div class="card" style="background:${p.bg || '#FFF8EC'};color:${p.ink || '#111'};font-size:${p.size || 64}px;font-weight:${p.weight || 800};clip-path:${p.torn ? torn : 'none'}">${p.html}</div>`;
  } else if (p.k === 'logo') {
    el.innerHTML = `<div class="kl" style="padding:26px 30px;display:flex;align-items:center;gap:22px;font:800 ${p.size || 54}px DEHead;color:#111">${p.svg ? `<img src="${J('assets/logos/' + p.svg + '.svg')}" style="height:${p.h || 90}px;width:auto">` : ''}${p.label ? `<span>${p.label}</span>` : ''}</div>`;
  } else if (p.k === 'num') {
    el.innerHTML = `<div class="num" style="background:${p.bg || '#FFF8EC'};color:${p.ink || '#111'};font-size:${p.size || 210}px"><span data-num="${p.value}" data-dec="${p.dec || 0}" data-pre="${p.pre || ''}" data-suf="${p.suf || ''}">0</span></div>`;
  } else if (p.k === 'tape') {
    el.className = 'pc tape'; el.style.width = (p.w || 220) + 'px';
  }
  if (p.k !== 'tape') el.style.zIndex = p.z || 2;
  return el;
}

async function build(s) {
  const el = document.createElement('div'); el.className = 'shot';
  if (!D.desk && !D.grid) el.style.background = s.bg || DE.color.blue;
  const cam = document.createElement('div'); cam.className = 'cam'; el.appendChild(cam); const pcs0 = [];
  if ((D.desk || D.grid) && s.sheet && s.sheet !== false) {  // brand colour as a sheet of paper laid on the desk under the content
    const sh = document.createElement('div'); sh.className = 'sheet pc'; const sd = Object.assign({ x: 50, y: 300, w: 980, h: 900, rot: -1.5 }, s.sheet || {});
    Object.assign(sh.style, { left: sd.x + 'px', top: sd.y + 'px', width: sd.w + 'px', height: sd.h + 'px', background: s.bg || '#FFF8EC', clipPath: CL.torn(seed++, 0.8) });
    sh._p = { at: -0.15, from: sd.from || 'bottom', rot: sd.rot, spin: 4, dist: 1400 }; cam.appendChild(sh); pcs0.push(sh);
  }
  const pcs = pcs0;
  for (const p of s.pieces || []) { const e = await piece(p); cam.appendChild(e); pcs.push(e); }
  if (s.src) el.insertAdjacentHTML('beforeend', `<div class="src">ที่มา: ${s.src}</div>`);
  if (s.section) el.insertAdjacentHTML('beforeend', `<div class="sect">${s.section}</div>`);
  document.getElementById('stage').appendChild(el);
  return { s, el, cam, pcs, videos: [...el.querySelectorAll('video')] };
}

window.setup = async (data) => {
  D = data; docs = D.docs;
  await DE.injectFonts(D.brandBase);
  document.getElementById('grain').style.backgroundImage = `url(${CL.grain()})`;
  const imgs = await DE.loadMascot(D.brandBase);
  mascot = new DE.Mascot(document.getElementById('mascot'), imgs, Object.assign({ x: 830, y: 2010, scale: 0.56, rim: false }, D.mascot));
  cap = new DE.Captions(document.body, D.captions, { y: 1160, size: 62, maxWidth: 1000 });  // quiet captions: the collage is the hero (ref AIพูด)
  fxG = document.getElementById('fx').getContext('2d');
  // desks: [{img, t0, t1, keys:[{t,x,y,s}]}] — one physical table per section, camera moves continuously within it
  D.desks = D.desks || (D.desk ? [Object.assign({ t0: 0, t1: 1e9 }, D.desk)] : []);
  D.desk = D.desks.length > 0;
  const holder = document.getElementById('desk'); holder.innerHTML = ''; holder.style.filter = `brightness(${D.deskDim ?? 1})`;  // dim the plate so cream pieces separate
  for (const d of D.desks) { const im = document.createElement('img'); im.src = J(d.img); await im.decode(); holder.appendChild(im); d.el = im; }
  for (const s of D.shots) shots.push(await build(s));
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  await Promise.all(shots.flatMap((x) => x.videos).map((v) => new Promise((ok) => { if (v.readyState >= 2) return ok(); v.addEventListener('loadeddata', ok, { once: true }); v.load(); setTimeout(ok, 8000); })));
};

const seek = (v, t) => new Promise((ok) => { const tt = Math.min(Math.max(0, t), (v.duration || 4) - 0.05); if (Math.abs(v.currentTime - tt) < 0.001) return ok(); v.addEventListener('seeked', ok, { once: true }); v.currentTime = tt; setTimeout(ok, 1500); });

function drawGrid(t) {
  const g = document.getElementById('grid').getContext('2d'); const G = D.grid; if (!G) return;
  let tint = G.tints[0]; for (const x of G.tints) if (t >= x.t) tint = x;
  g.clearRect(0, 0, 1080, 1920);
  if (tint.bg) { g.fillStyle = tint.bg; g.fillRect(0, 0, 1080, 1920); }
  const step = 60, ox = (t * 4) % step, oy = (t * 7) % step;   // slow drift, never static, never busy
  g.lineWidth = tint.w || 2; g.strokeStyle = tint.line;
  for (let x = -step + ox; x < 1080 + step; x += step) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1920); g.stroke(); }
  for (let y = -step + oy; y < 1920 + step; y += step) { g.beginPath(); g.moveTo(0, y); g.lineTo(1080, y); g.stroke(); }
  if (!tint.major) return;
  g.lineWidth = 3; g.strokeStyle = tint.major;  // every 4th line a little stronger, like graph paper
  for (let x = -step * 4 + ox; x < 1080 + step; x += step * 4) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1920); g.stroke(); }
  for (let y = -step * 4 + oy; y < 1920 + step; y += step * 4) { g.beginPath(); g.moveTo(0, y); g.lineTo(1080, y); g.stroke(); }
}
function deskCam(t, K) { let a = K[0], b = K[K.length - 1];
  for (let i = 0; i < K.length - 1; i++) if (t >= K[i].t && t <= K[i + 1].t) { a = K[i]; b = K[i + 1]; break; }
  if (t < K[0].t) b = a; if (t > K[K.length - 1].t) a = b;
  const k = DE.ease.inOutCubic(DE.clamp((t - a.t) / ((b.t - a.t) || 1)));
  return { x: DE.lerp(a.x, b.x, k), y: DE.lerp(a.y, b.y, k), s: DE.lerp(a.s, b.s, k) };
}
window.renderAt = async (t) => {
  drawGrid(t);
  for (const d of D.desks || []) {
    const on = t >= d.t0 && t < d.t1; d.el.style.display = on ? 'block' : 'none';
    if (on) { const c = deskCam(t, d.keys); d.el.style.transform = `translate(${-c.x}px,${-c.y}px) scale(${c.s})`; }
  }
  for (const x of shots) {
    const { s, el, cam, pcs } = x, on = t >= s.t0 && t < s.t1;
    el.style.display = on ? 'block' : 'none'; if (!on) continue;
    const dt = t - s.t0, dur = s.t1 - s.t0;
    cam.style.transform = `scale(${DE.lerp(s.zoom?.[0] ?? 1, s.zoom?.[1] ?? 1.045, DE.ease.inOutCubic(DE.clamp(dt / dur)))})`;
    for (const e of pcs) {
      const p = e._p, a = CL.arrive(dt - (p.at ?? 0), p.from || 'bottom');
      e.style.opacity = a.o;
      e.style.transform = `translate(${a.x}px,${a.y}px) rotate(${(p.rot || 0) + a.r}deg) scale(${a.s})`;
      e.querySelectorAll('[data-hl]').forEach((h) => { h.style.transform = `scaleX(${DE.ease.outCubic(DE.clamp((dt - parseFloat(h.dataset.hl)) / 0.35))})`; });
      e.querySelectorAll('[data-num]').forEach((n) => { n.textContent = n.dataset.pre + CL.count(parseFloat(n.dataset.num), dt - (p.at ?? 0) - 0.15, 0.7, +n.dataset.dec) + n.dataset.suf; });
    }
    for (const v of x.videos) { const p = v.closest('.pc')._p; await seek(v, (p.t || 0) + Math.max(0, dt - (p.at ?? 0))); }
  }
  mascot.renderAt(t);
  cap.renderAt(t);
  fxG.clearRect(0, 0, 1080, 1920);
  for (const f of D.flashes || []) { const d = t - f; if (d >= 0 && d < 2 / 30) { fxG.fillStyle = 'rgba(255,248,236,.9)'; fxG.fillRect(0, 0, 1080, 1920); } }
};
</script></body></html>
